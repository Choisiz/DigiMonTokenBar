name: Deploy website
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'assets/readme-screenshots/**'
      - 'Sources/PokeTokenBar/Resources/Digimon/AppIcon.png'
      - 'scripts/build-digimon-app.sh'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Assemble public website
        run: python3 site/build.py --output build/pages-public
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/pages-public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
