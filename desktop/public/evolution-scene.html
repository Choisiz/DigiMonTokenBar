<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
:root{color-scheme:dark;--cyan:#7dd3fc;--gold:#ffdf70;--muted:#85a9bd;--line:#294756}*{box-sizing:border-box}body{margin:0;background:#030a10;color:#e3f3fc;font:13px -apple-system,BlinkMacSystemFont,sans-serif;min-height:100vh;display:grid;place-items:center;padding:36px 18px;background-image:linear-gradient(#183c5014 1px,transparent 1px),linear-gradient(90deg,#183c5014 1px,transparent 1px);background-size:38px 38px}.study{width:min(100%,500px)}header{margin-bottom:22px}.eyebrow{font:9px ui-monospace,monospace;letter-spacing:2.5px;color:var(--cyan)}h1{font-size:25px;font-weight:600;letter-spacing:-.6px;margin:9px 0}header p{font-size:12px;line-height:1.7;color:var(--muted);margin:0}.terminal{background:#06121a;border:1px solid #345569;position:relative;box-shadow:0 20px 100px #0008}.terminal:before{content:'';position:absolute;top:-1px;left:-1px;width:42px;height:2px;background:var(--cyan)}.topline{display:flex;justify-content:space-between;gap:8px;padding:15px 17px;border-bottom:1px solid #29475670;font:9px ui-monospace,monospace;letter-spacing:1.3px;color:#8eb4c9}.topline span:first-child{color:var(--cyan)}.topline span:last-child{font-size:8px;color:#7da693}canvas{display:block;width:100%;height:auto;aspect-ratio:420/365}.readout{padding:0 20px 18px;text-align:center;min-height:92px}#phase{color:var(--cyan);font:9px ui-monospace,monospace;letter-spacing:2px}#title{font-size:23px;letter-spacing:1px;margin:7px 0 6px;font-weight:600}#detail{font-size:11px;color:var(--muted);line-height:1.6;min-height:18px;margin:0}.timeline{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:16px 18px;border-top:1px solid #29475670}.step{color:#65879b;font-size:9px;line-height:1.7}.step:before{content:'';height:2px;display:block;background:#173343;margin-bottom:7px}.step.active{color:#d2efff}.step.active:before{background:var(--cyan);box-shadow:0 0 8px #7dd3fc50}.step.done:before{background:#46748b}.step b{font:8px ui-monospace,monospace;margin-right:4px;opacity:.65}.controls{display:flex;align-items:center;gap:8px;padding:16px 0 12px}button{border:1px solid #5fa6cc;background:#7dd3fc13;color:#d8f2ff;padding:11px 19px;font:12px inherit;cursor:pointer;min-height:40px}button:hover{background:#7dd3fc26}button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:4px}button:disabled{opacity:.4;cursor:wait}.secondary{border-color:#294756;background:transparent;color:#8caec2}label{margin-left:auto;color:#85a9bd;font-size:11px;display:flex;align-items:center;gap:5px;cursor:pointer}input{accent-color:#7dd3fc}.note{font-size:11px;line-height:1.8;color:#66889c;margin:0}.caption{margin-top:14px;font:8px ui-monospace,monospace;color:#476d83;letter-spacing:1px}.error{color:#ffc88b}@media(max-width:420px){body{padding:20px 12px}h1{font-size:22px}.controls{flex-wrap:wrap}label{font-size:10px}button{padding:10px 13px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}

[hidden]{display:none!important}.preview-switch{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;padding:10px 12px;border:1px dashed #294756;color:#85a9bd;font-size:10px}.preview-switch label{margin:0}.home-card{padding:18px}.home-nav{display:flex;justify-content:space-between;padding-bottom:15px;border-bottom:1px solid var(--line);font-size:10px;color:var(--muted)}.home-nav strong{color:var(--cyan);font-weight:500}.partner-row{display:flex;align-items:center;gap:20px;margin:22px 0}.partner-row canvas{width:132px;height:132px;aspect-ratio:1;flex:none}.partner-info{min-width:0;flex:1}.partner-info small{font:8px ui-monospace,monospace;color:var(--muted)}.partner-info h2{font-size:23px;margin:7px 0}.stage-chip{font-size:9px;color:var(--cyan);border:1px solid #355b70;padding:3px 7px;display:inline-block}.growth-label{font-size:9px;color:var(--muted);margin:18px 0 7px}.growth-bar{height:4px;background:#163041}.growth-bar span{display:block;width:100%;height:100%;background:var(--cyan)}.growth-numbers{font:9px ui-monospace,monospace;margin-top:7px;color:#b9d9eb}.home-command{display:flex;align-items:center;gap:8px;padding-top:14px;border-top:1px solid var(--line)}.home-command>span{font-size:10px;color:var(--muted);margin-right:auto}.bulb-button{width:42px;padding:8px;display:grid;place-items:center;border-color:var(--cyan);background:#7dd3fc1c;box-shadow:0 0 18px #7dd3fc18}.bulb-button svg{width:21px;height:21px;fill:none;stroke:var(--cyan);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.ready-copy{font-size:10px;color:#a6deed;margin:12px 0 0;line-height:1.8}.back-button{min-height:24px;font-size:9px;padding:3px 6px;border-color:#294756}.home-note{font-size:10px;color:var(--muted);line-height:1.7;margin-top:16px}.home-command .secondary{font-size:10px;padding:8px 10px}.tip{color:var(--gold)}
#home-view{max-width:420px;margin:auto}#home-frame{display:block;border:0;width:420px;height:686px;max-width:none}#home-view{overflow-x:auto}#home-view .home-note{margin:12px 0 16px}
body{display:block;min-height:0;padding:0;background:#06121a}.study{width:100%}.terminal{border:0;box-shadow:none}.controls{padding:12px 18px}.note{padding:0 18px 12px}.topline{display:none}html,body{min-height:100%;background-color:#06121a}body{min-height:100vh;background-image:var(--scene-circuit);background-size:420px 520px}.study{min-height:100vh}.study>.terminal{background:transparent}</style><main class="study"><section class="terminal"><div id="system" hidden></div><canvas id="scene" width="840" height="730" role="img" aria-label="Digimon evolution animation"></canvas><div class="readout" role="status" aria-live="polite"><div id="phase"></div><h2 id="title">Evolution ready</h2><p id="detail"></p></div><div class="timeline"><div class="step">Connect</div><div class="step">Synchronize</div><div class="step">Reconstruct</div><div class="step">Reveal</div></div></section><div class="controls"><button id="start" disabled>Loading artwork…</button><button id="reset" class="secondary" hidden disabled>Reset</button><label><input id="reduced" type="checkbox">Reduced motion</label></div><p class="note">Collection records are retained. One required item is consumed when evolution starts.</p></main><script src="./evolution-runtime.js"></script></html>
